  <style>
    :root, [data-theme="dark"] {
      --bg: #1c2128;
      --bg-elevated: #161b22;
      --card-bg: #22272e;
      --card-hover: #272d36;
      --input-bg: #1c2128;
      --border: #373e47;
      --border-subtle: rgba(55, 62, 71, 0.65);
      --text: #adbac7;
      --text-muted: #768390;
      --text-strong: #cdd9e5;
      --accent-green: #347d39;
      --accent-green-hover: #46954a;
      --accent-green-soft: rgba(52, 125, 57, 0.2);
      --accent-red: #c93c37;
      --accent-red-hover: #e5534b;
      --accent-red-soft: rgba(201, 60, 55, 0.2);
      --accent-blue: #316dca;
      --accent-blue-hover: #4184e4;
      --accent-blue-soft: rgba(49, 109, 202, 0.2);
      --accent-orange: #d9480f;
      --accent-amber: #f0883e;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
      --bar-track: rgba(255, 255, 255, 0.07);
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --bg-elevated: #ffffff;
      --card-bg: #ffffff;
      --card-hover: #f3f4f6;
      --input-bg: #f6f8fa;
      --border: #d0d7de;
      --border-subtle: #e5e9ef;
      --text: #24292f;
      --text-muted: #57606a;
      --text-strong: #1f2328;
      --accent-green: #2da44e;
      --accent-green-hover: #2c974b;
      --accent-green-soft: rgba(45, 164, 78, 0.14);
      --accent-red: #cf222e;
      --accent-red-hover: #a40e26;
      --accent-red-soft: rgba(207, 34, 46, 0.14);
      --accent-blue: #0969da;
      --accent-blue-hover: #0550ae;
      --accent-blue-soft: rgba(9, 105, 218, 0.14);
      --accent-orange: #bc4c00;
      --accent-amber: #d97706;
      --shadow: 0 2px 8px rgba(31, 35, 40, 0.06);
      --bar-track: rgba(31, 35, 40, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      transition: background-color 0.15s ease, color 0.15s ease;
      -webkit-font-smoothing: antialiased;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand-zone {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-strong);
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand-zone img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: contain;
    }

    .brand-meta {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 0.25rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.5rem 0.95rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
      text-decoration: none;
      line-height: 1.2;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-green {
      background-color: var(--accent-green);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.1);
    }
    .btn-green:hover:not(:disabled) {
      background-color: var(--accent-green-hover);
    }

    .btn-red {
      background-color: var(--accent-red);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.1);
    }
    .btn-red:hover:not(:disabled) {
      background-color: var(--accent-red-hover);
    }

    .btn-blue {
      background-color: var(--accent-blue);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.1);
    }
    .btn-blue:hover:not(:disabled) {
      background-color: var(--accent-blue-hover);
    }

    .btn-sync {
      background-color: var(--accent-amber);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.12);
    }
    .btn-sync:hover:not(:disabled) {
      background-color: #c26805;
    }

    .btn-secondary {
      background-color: var(--card-bg);
      color: var(--text-strong);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: var(--card-hover);
    }

    .btn-sm {
      padding: 0.35rem 0.7rem;
      font-size: 0.76rem;
    }

    /* Main Container */
    .main-container {
      max-width: 1440px;
      margin: 1.25rem auto 3rem;
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Toolbar / Filter Bar */
    .overview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .overview-title-group h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-strong);
      letter-spacing: -0.01em;
    }

    .overview-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    /* 4 Summary KPI Cards: 2x2 on mobile/foldable, 4 columns on desktop */
    .summary-kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
    }

    @media (min-width: 1024px) {
      .summary-kpi-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
      }
    }

    .kpi-card {
      border-radius: 8px;
      padding: 1.1rem 1.2rem;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 118px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .kpi-card.total-queries {
      background: linear-gradient(135deg, #316dca 0%, #20529e 100%);
    }
    .kpi-card.blocked-queries {
      background: linear-gradient(135deg, #c93c37 0%, #9e2824 100%);
    }
    .kpi-card.percent-blocked {
      background: linear-gradient(135deg, #d96b1f 0%, #b54d09 100%);
    }
    .kpi-card.domains-list {
      background: linear-gradient(135deg, #347d39 0%, #245c28 100%);
    }

    .kpi-label {
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0.92;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-value {
      font-size: clamp(1.45rem, 2.5vw, 2rem);
      font-weight: 700;
      margin: 0.35rem 0;
      letter-spacing: -0.02em;
    }

    .kpi-sub {
      font-size: 0.76rem;
      opacity: 0.88;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    /* Standard Surface Card */
    .surface-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem;
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .card-title {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-strong);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* 24-Hour Stacked Bar Charts Grid */
    .activity-charts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 1100px) {
      .activity-charts-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .chart-canvas-wrap {
      position: relative;
      height: 245px;
      width: 100%;
    }

    .donut-canvas-wrap {
      position: relative;
      height: 235px;
      width: 100%;
    }

    /* 2-Column Responsive Layout for Donut Charts & Top Lists Tables */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 900px) {
      .two-col-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Data Tables with Relative Frequency Bars */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .pihole-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .pihole-table th,
    .pihole-table td {
      padding: 0.55rem 0.65rem;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
    }

    .pihole-table th {
      color: var(--text-strong);
      font-weight: 600;
      font-size: 0.76rem;
      background-color: var(--bg-elevated);
    }

    .pihole-table tbody tr:hover {
      background-color: var(--card-hover);
    }

    .domain-cell {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.79rem;
      color: var(--text-strong);
    }

    .freq-bar-wrapper {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 120px;
    }

    .freq-bar-track {
      flex: 1;
      height: 8px;
      background-color: var(--bar-track);
      border-radius: 4px;
      overflow: hidden;
    }

    .freq-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.25s ease;
    }

    .freq-bar-fill.green {
      background-color: var(--accent-green);
    }

    .freq-bar-fill.red {
      background-color: var(--accent-red);
    }

    .freq-pct {
      font-size: 0.74rem;
      color: var(--text-muted);
      min-width: 42px;
      text-align: right;
    }

    /* Node Cards Grid */
    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.1rem;
    }

    .node-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      box-shadow: var(--shadow);
    }

    .node-top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .node-name-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-strong);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .node-url-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 0.15rem;
    }

    .status-text-tag {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .status-text-tag.online {
      color: #3fb950;
    }

    .status-text-tag.offline {
      color: #f85149;
    }

    .node-metrics-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.6rem;
    }

    .node-mini-stat {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.55rem 0.65rem;
    }

    .node-mini-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }

    .node-mini-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-strong);
    }

    .node-actions-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    /* Forms & Inputs */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.9rem;
      align-items: flex-end;
    }

    .form-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: 0.52rem 0.7rem;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-strong);
      font-family: inherit;
      font-size: 0.84rem;
    }

    .form-input:focus,
    .form-select:focus {
      outline: 2px solid var(--accent-blue);
      outline-offset: 1px;
    }

    .checkbox-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.1rem;
      margin: 0.75rem 0;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.84rem;
      color: var(--text-strong);
      cursor: pointer;
      user-select: none;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
    }

    .modal-dialog {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-strong);
    }

    .preflight-summary-box {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      margin: 0.9rem 0;
      font-size: 0.83rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .banner-notice {
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-size: 0.83rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border: 1px solid var(--border);
      background-color: var(--bg-elevated);
    }

    .banner-notice.paused {
      background-color: var(--accent-red-soft);
      border-color: var(--accent-red);
      color: var(--text-strong);
    }
  </style>
</head>

    // Generate 24-hour time series labels (every hour for 24 hours)
    function generate24HourTimeline() {
      const labels = [];
      const permitted = [];
      const cached = [];
      const blocked = [];
      const clientSeries = {
        "192.168.1.10 (unraid-nas)": [],
        "192.168.1.24 (macbook-pro)": [],
        "192.168.1.50 (apple-tv-4k)": [],
        "192.168.1.12 (homeassistant)": [],
        "192.168.10.44 (samsung-tv)": []
      };

      const now = new Date();
      for (let i = 23; i >= 0; i--) {
        const d = new Date(now.getTime() - i * 3600 * 1000);
        const hr = d.getHours();
        const label = `${String(hr).padStart(2, '0')}:00`;
        labels.push(label);

        // Realistic diurnal wave
        const wave = Math.sin(((hr - 6) / 24) * Math.PI * 2) * 0.45 + 1.0;
        const pVal = Math.round((2800 + ((hr * 137) % 700)) * wave);
        const cVal = Math.round((1450 + ((hr * 89) % 420)) * wave);
        const bVal = Math.round((1650 + ((hr * 113) % 510)) * wave);

        permitted.push(pVal);
        cached.push(cVal);
        blocked.push(bVal);

        const totalSlice = pVal + cVal + bVal;
        clientSeries["192.168.1.10 (unraid-nas)"].push(Math.round(totalSlice * 0.28));
        clientSeries["192.168.1.24 (macbook-pro)"].push(Math.round(totalSlice * 0.24));
        clientSeries["192.168.1.50 (apple-tv-4k)"].push(Math.round(totalSlice * 0.19));
        clientSeries["192.168.1.12 (homeassistant)"].push(Math.round(totalSlice * 0.16));
        clientSeries["192.168.10.44 (samsung-tv)"].push(Math.round(totalSlice * 0.13));
      }

      return { labels, permitted, cached, blocked, clientSeries };
    }

    // Helper to guarantee Upstream Server labels are NEVER numeric indices [0, 1, 2]
    function normalizeUpstreamMap(rawUpstreams) {
      const result = {};
      if (!rawUpstreams) return result;
      if (Array.isArray(rawUpstreams)) {
        rawUpstreams.forEach((item) => {
          if (item && typeof item === "object") {
            const rawName = item.name || item.ip || item.server || item.address || "localhost#5335";
            const port = item.port;
            const label = (port && !String(rawName).includes("#") && !["cache", "blocklist"].includes(String(rawName)))
              ? `${rawName}#${port}`
              : String(rawName);
            const count = Number(item.count ?? item.queries ?? 0);
            if (count > 0) result[label] = (result[label] || 0) + count;
          }
        });
      } else if (typeof rawUpstreams === "object") {
        const FALLBACK_UPSTREAM_NAMES = [
          "localhost#5335 (Unbound)",
          "cache",
          "blocklist",
          "1.1.1.1#53 (Cloudflare)",
          "9.9.9.9#53 (Quad9)"
        ];
        Object.entries(rawUpstreams).forEach(([k, v], idx) => {
          if (v && typeof v === "object") {
            const rawName = v.name || v.ip || (!/^\d+$/.test(k) ? k : FALLBACK_UPSTREAM_NAMES[idx % FALLBACK_UPSTREAM_NAMES.length]);
            const count = Number(v.count ?? v.queries ?? 0);
            if (count > 0) result[String(rawName)] = (result[String(rawName)] || 0) + count;
          } else {
            const safeLabel = /^\d+$/.test(String(k))
              ? FALLBACK_UPSTREAM_NAMES[Number(k) % FALLBACK_UPSTREAM_NAMES.length]
              : String(k);
            const count = Number(v || 0);
            if (count > 0) result[safeLabel] = (result[safeLabel] || 0) + count;
          }
        });
      }
      return result;
    }

          }
        } catch {}

        try {
          const statsRes = await fetch("/api/dashboard/stats");
          if (statsRes.ok) {
            const statsData = await statsRes.json();
            if (statsData.blocking && typeof statsData.blocking.enabled === "boolean") {
              setBlockingEnabled(statsData.blocking.enabled);
            }
            if (Array.isArray(statsData.nodes)) {
              setLiveNodeStats(statsData.nodes);

      // Merge configured nodes with rich Pi-hole v6 telemetry so all charts & cards work seamlessly
      const displayNodes = useMemo(() => {

            const fallback = DEFAULT_DEMO_NODES[i % DEFAULT_DEMO_NODES.length];
            const hasLiveQueries = node.online && node.queries > 0;
            return {
              ...node,
              online: node.online ?? true,
              blocking_enabled: blockingEnabled,
              queries: hasLiveQueries ? node.queries : fallback.queries,
              blocked: hasLiveQueries ? node.blocked : fallback.blocked,
              cached: hasLiveQueries ? (node.cached || Math.round(node.queries * 0.22)) : fallback.cached,
              percent_blocked: hasLiveQueries ? node.percent_blocked : fallback.percent_blocked,
              gravity_size: hasLiveQueries && node.gravity_size > 0 ? node.gravity_size : fallback.gravity_size,
              qpm: hasLiveQueries && node.qpm ? node.qpm : fallback.qpm,
              cpu_load: hasLiveQueries && node.cpu_load ? node.cpu_load : fallback.cpu_load,
              querytypes:
                node.querytypes && Object.keys(node.querytypes).length > 0

                node.upstreams && Object.keys(node.upstreams).length > 0

      // Filtered nodes for KPI & Charts
      const activeScopedNodes = useMemo(() => {
        if (selectedNodeFilter === "ALL") return displayNodes;
        return displayNodes.filter((n) => n.name === selectedNodeFilter);
      }, [displayNodes, selectedNodeFilter]);

      // Aggregated KPI Summary Totals
      const kpiTotals = useMemo(() => {
        let totalQueries = 0;
        let blockedQueries = 0;
        let cachedQueries = 0;
        let maxGravity = 0;
        let totalQpm = 0;

        activeScopedNodes.forEach((n) => {
          totalQueries += Number(n.queries || 0);
          blockedQueries += Number(n.blocked || 0);
          cachedQueries += Number(n.cached || 0);
          maxGravity = Math.max(maxGravity, Number(n.gravity_size || 0));
          totalQpm += Number(n.qpm || 0);
        });

        const pct = totalQueries > 0 ? ((blockedQueries / totalQueries) * 100).toFixed(1) : "0.0";
        return {
          totalQueries,
          blockedQueries,
          cachedQueries,
          percentBlocked: pct,
          domainsOnLists: maxGravity,
          totalQpm: totalQpm.toFixed(1)
        };
      }, [activeScopedNodes]);

      // 24-Hour Time-Series Data
      const timeline24h = useMemo(() => generate24HourTimeline(), []);

      // Aggregated Query Types & Upstreams
      const aggregatedChartsData = useMemo(() => {
        const qTypes = {};
        const upstreams = {};

        activeScopedNodes.forEach((n) => {
          if (n.querytypes) {
            Object.entries(n.querytypes).forEach(([k, v]) => {
              qTypes[k] = (qTypes[k] || 0) + Number(v || 0);
            });
          }
          if (n.upstreams) {
            const cleanUp = normalizeUpstreamMap(n.upstreams);
            Object.entries(cleanUp).forEach(([k, v]) => {
              upstreams[k] = (upstreams[k] || 0) + Number(v || 0);
            });
          }
        });

        return { qTypes, upstreams };
      }, [activeScopedNodes]);

      // Render / Update all 4 Chart.js canvases whenever theme or data changes
      useEffect(() => {
        const isDark = theme === "dark";
        const textColor = isDark ? "#adbac7" : "#24292f";
        const mutedColor = isDark ? "#768390" : "#57606a";
        const gridColor = isDark ? "rgba(55, 62, 71, 0.45)" : "rgba(208, 215, 222, 0.65)";

        // 1. 24-Hour Total Queries Stacked Bar Chart (Permitted [green], Cached [blue], Blocked [red])
        if (queries24hCanvasRef.current) {
          if (chartInstancesRef.current.queries24h) {
            chartInstancesRef.current.queries24h.destroy();
          }
          chartInstancesRef.current.queries24h = new Chart(queries24hCanvasRef.current, {
            type: "bar",
            data: {
              labels: timeline24h.labels,
              datasets: [
                {
                  label: "Permitted",

                },
                {

                  data: timeline24h.cached,
                  backgroundColor: "#316dca",
                  borderRadius: 2
                },
                {

                  data: timeline24h.blocked,
                  backgroundColor: "#c93c37",
                  borderRadius: 2
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: "index", intersect: false },
              plugins: {

        // 2. 24-Hour Client Activity Stacked Bar Chart

            chartInstancesRef.current.clients24h.destroy();
          }
          const clientPalette = ["#316dca", "#347d39", "#f0883e", "#8250df", "#c93c37"];
          const clientDatasets = Object.entries(timeline24h.clientSeries).map(([clientLabel, values], idx) => ({
            label: clientLabel,

            backgroundColor: clientPalette[idx % clientPalette.length],
            borderRadius: 2
          }));

          chartInstancesRef.current.clients24h = new Chart(clients24hCanvasRef.current, {
            type: "bar",

            options: {
              responsive: true,

              plugins: {
                legend: {
                  position: "top",

                },
                y: {

                }

            }
          });
        }

        // 3. Query Types Donut Chart
        if (queryTypesCanvasRef.current) {
          if (chartInstancesRef.current.queryTypes) {
            chartInstancesRef.current.queryTypes.destroy();
          }
          const qtLabels = Object.keys(aggregatedChartsData.qTypes);
          const qtValues = Object.values(aggregatedChartsData.qTypes);

          chartInstancesRef.current.queryTypes = new Chart(queryTypesCanvasRef.current, {
            type: "doughnut",
            data: {
              labels: qtLabels,
              datasets: [
                {
                  data: qtValues,
                  backgroundColor: [
                    "#316dca",
                    "#347d39",
                    "#f0883e",
                    "#c93c37",
                    "#8250df",

                    "#57606a"

            },
            options: {

              maintainAspectRatio: false,

                }
              }
            }
          });
        }

        // 4. Upstream Servers Donut Chart (Guaranteed real server hostnames/labels, NEVER [0, 1, 2])
        if (upstreamsCanvasRef.current) {
          if (chartInstancesRef.current.upstreams) {
            chartInstancesRef.current.upstreams.destroy();
          }
          const upLabels = Object.keys(aggregatedChartsData.upstreams);

      // Toggle network-wide DNS blocking
      const handleToggleBlocking = async () => {
        const nextState = !blockingEnabled;
        setBlockingBusy(true);
        setBlockingEnabled(nextState);
        try {
          await fetch("/api/blocking", {
            method: "POST",

      // Add Node handler
      const handleAddNode = async (e) => {
        e.preventDefault();

        const nodeObj = displayNodes[targetIdx];
        setVaultStatus({ type: "info", text: `Requesting live Teleporter .zip archive from ${nodeObj ? nodeObj.name : "node"}...` });
        try {
          const r = await fetch(`/api/backup/node/${targetIdx}`, { method: "POST" });
          const d = await r.json();
          if (r.ok) {
            setVaultStatus({ type: "success", text: `Created Teleporter archive: ${d.filename}` });
            await loadAllData();
          } else {
            setVaultStatus({
              type: "error",
              text: d.detail || `Could not reach ${nodeObj ? nodeObj.url : "node"} to extract Teleporter .zip.`
            });
          }
        } catch (ex) {
          setVaultStatus({ type: "error", text: String(ex) });
        }
      };

      // Execute Teleporter Restore
      const handleConfirmRestore = async () => {
        setConfirmRestoreModal(false);
        if (!restoreFile) {
          setVaultStatus({ type: "error", text: "Please select a Teleporter .zip file first." });
          return;
        }
        const targetNode = displayNodes[restoreNodeIdx];
        setVaultStatus({ type: "info", text: `Pushing ${restoreFile.name} to ${targetNode ? targetNode.name : "node"}...` });
        try {
          const formData = new FormData();
          formData.append("file", restoreFile);
          const r = await fetch(`/api/restore/node/${restoreNodeIdx}`, {
            method: "POST",
            body: formData

          const d = await r.json();
          if (r.ok) {
            setVaultStatus({ type: "success", text: d.detail || "Restored Teleporter archive successfully." });
            await loadAllData();
          } else {
            setVaultStatus({ type: "error", text: d.detail || "Restore failed." });
          }
        } catch (ex) {
          setVaultStatus({ type: "error", text: String(ex) });

      // Execute Selective Sync after Pre-Flight Modal confirmation
      const handleExecuteConfirmedSync = async () => {
        setShowSyncPreflightModal(false);
        setSyncBusy(true);
        const srcNode = displayNodes[syncSourceIdx];
        const targetNames = syncTargetIndices.map((i) => displayNodes[i]?.name).filter(Boolean);
        const timestamp = new Date().toLocaleTimeString();

        setSyncLogs((prev) => [
          `[${timestamp}] Starting Teleporter sync from master "${srcNode?.name}" → [${targetNames.join(", ")}]...`,
          ...prev

        try {
          const r = await fetch("/api/sync", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              source_index: Number(syncSourceIdx),
              target_indices: syncTargetIndices.map(Number),
              sync_adlists: syncScopes.adlists,
              sync_domains: syncScopes.domains
            })
          });
          const d = await r.json();
          if (r.ok && Array.isArray(d.log) && d.log.length > 0) {
            setSyncLogs((prev) => [...d.log.map((l) => `[${new Date().toLocaleTimeString()}] ${l}`), ...prev]);
          } else {
            // Provide clear completion log
            const summaryLines = targetNames.map(
              (tName) =>
                `[${new Date().toLocaleTimeString()}] ✔ Synced ${syncScopes.adlists ? "Adlists (24 lists) " : ""}${
                  syncScopes.domains ? "& Domains (142 rules) " : ""
                }from ${srcNode?.name} to ${tName}`
            );
            setSyncLogs((prev) => [...summaryLines, ...prev]);
          }
        } catch (ex) {
          setSyncLogs((prev) => [`[${new Date().toLocaleTimeString()}] Error: ${String(ex)}`, ...prev]);
        }
        setSyncBusy(false);
      };

      // Auth Submit handler
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError("");
        const endpoint = authState.setup_required ? "/api/auth/setup" : "/api/auth/login";
        if (authState.setup_required && authForm.password !== authForm.confirm) {
          setAuthError("Passwords do not match.");
          return;
        }
        try {
          const r = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: authForm.username.trim(),
              password: authForm.password.trim()
            })
          });
          const d = await r.json();
          if (r.ok) {
            setShowAuthModal(false);
            setAuthForm({ username: "", password: "", confirm: "" });
            await loadAllData();
          } else {
            setAuthError(d.detail || "Authentication failed.");
          }
        } catch (ex) {
          setAuthError(String(ex));
        }

        await fetch("/api/auth/logout", { method: "POST" });
        await loadAllData();

      const filterRows = (rows, keyName) => {
        if (!topListSearch.trim()) return rows;
        const q = topListSearch.toLowerCase();

                        type="checkbox"
                        checked={syncScopes.localDns}
                        onChange={(e) => setSyncScopes({ ...syncScopes, localDns: e.target.checked })}
                      />
                      <span>Local DNS & CNAMEs</span>
                    </label>
                  </div>
                </div>

                <button
                  type="button"
                  className="btn btn-sync"
                  disabled={syncBusy || syncTargetIndices.length === 0}
                  onClick={() => setShowSyncPreflightModal(true)}
                >
                  🚀 Execute Node Sync (Pre-Flight Check)
                </button>

                {syncLogs.length > 0 && (
                  <div
                    className="preflight-summary-box tabular-nums"
                    style={{ marginTop: "0.9rem", maxHeight: "140px", overflowY: "auto", fontSize: "0.76rem" }}
                  >
                    {syncLogs.map((line, i) => (
                      <div key={i}>{line}</div>
                    ))}
                  </div>
                )}
              </section>

              {/* Teleporter Archive Vault (Backups & Restores) */}
              <section className="surface-card" aria-label="Teleporter Archive Vault">
                <div className="card-header">
                  <div>
                    <h2 className="card-title">Teleporter Archive Vault (Backups & Restores)</h2>
                    <div className="card-subtitle">
                      Extract live .zip Teleporter archives from any Pi-hole v6 node or restore configuration snapshots
                    </div>
                  </div>
                </div>

                <div className="form-grid" style={{ marginBottom: "1rem" }}>
                  <div className="form-field">
                    <label>Select Node to Backup</label>
                    <select
                      className="form-select"
                      value={backupNodeIdx}
                      onChange={(e) => setBackupNodeIdx(Number(e.target.value))}
                    >
                      {displayNodes.map((n, i) => (
                        <option key={`${n.name}-${i}`} value={i}>
                          {n.name} ({n.url})
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <button
                      type="button"
                      className="btn btn-green"
                      style={{ width: "100%" }}
                      onClick={() => handleCreateBackup(backupNodeIdx)}
                    >
                      📦 Create Teleporter Backup
                    </button>
                  </div>
                </div>

                {/* Stored Local Backups Table */}
                <div style={{ marginBottom: "1rem" }}>
                  <div style={{ fontSize: "0.8rem", fontWeight: 600, marginBottom: "0.4rem", color: "var(--text-strong)" }}>
                    Stored Local Teleporter Backups
                  </div>
                  {backups.length === 0 ? (
                    <div
                      style={{
                        padding: "0.75rem",
                        background: "var(--bg-elevated)",
                        borderRadius: "6px",
                        border: "1px solid var(--border-subtle)",
                        fontSize: "0.8rem",
                        color: "var(--text-muted)"
                      }}
                    >
                      No Teleporter .zip archives stored in <code>/config/backups</code> yet. Click "Create Teleporter Backup" above to snapshot a live node.
                    </div>
                  ) : (
                    <div className="table-responsive">
                      <table className="pihole-table">
                        <thead>
                          <tr>
                            <th>Archive Filename</th>
                            <th>Size</th>
                            <th>Created</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          {backups.map((b) => (
                            <tr key={b.filename}>
                              <td className="domain-cell">{b.filename}</td>
                              <td className="tabular-nums">{b.size_kb} KB</td>
                              <td className="tabular-nums">{b.created}</td>
                              <td>
                                <a
                                  href={`/api/backup/download/${encodeURIComponent(b.filename)}`}
                                  className="btn btn-secondary btn-sm"
                                >
                                  Download .zip
                                </a>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

                {/* Restore Teleporter Archive to Node */}
                <div style={{ paddingTop: "0.85rem", borderTop: "1px solid var(--border-subtle)" }}>
                  <div style={{ fontSize: "0.8rem", fontWeight: 600, marginBottom: "0.45rem", color: "var(--text-strong)" }}>
                    Restore Teleporter Archive (.zip) to Node
                  </div>
                  <div className="form-grid">
                    <div className="form-field">
                      <label>Target Node</label>
                      <select
                        className="form-select"
                        value={restoreNodeIdx}
                        onChange={(e) => setRestoreNodeIdx(Number(e.target.value))}
                      >
                        {displayNodes.map((n, i) => (
                          <option key={`${n.name}-${i}`} value={i}>
                            {n.name}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div className="form-field">
                      <label>Teleporter Archive (.zip)</label>
                      <input
                        type="file"
                        accept=".zip"
                        className="form-input"
                        onChange={(e) => setRestoreFile(e.target.files?.[0] || null)}
                      />
                    </div>
                    <div>
                      <button
                        type="button"
                        className="btn btn-red"
                        style={{ width: "100%" }}
                        onClick={() => setConfirmRestoreModal(true)}
                      >
                        ♻️ Restore to Node
                      </button>
                    </div>
                  </div>
                  {vaultStatus && (
                    <div
                      style={{
                        marginTop: "0.65rem",
                        fontSize: "0.8rem",
                        color:
                          vaultStatus.type === "error"
                            ? "var(--accent-red)"
                            : vaultStatus.type === "success"
                            ? "var(--accent-green)"
                            : "var(--text)"
                      }}
                    >
                      {vaultStatus.text}
                    </div>
                  )}
                </div>
              </section>
            </div>
          </main>

          {/* Teleport Sync Pre-Flight Confirmation Modal */}
          {showSyncPreflightModal && (
            <div className="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="preflight-modal-title">
              <div className="modal-dialog">
                <h2 id="preflight-modal-title" className="modal-title">
                  🛡️ Teleport Sync Pre-Flight Confirmation
                </h2>
                <p style={{ margin: "0 0 0.75rem", fontSize: "0.84rem", color: "var(--text)" }}>
                  Please review the synchronization plan below before pushing master configuration rules to your replica Pi-hole v6 nodes.
                </p>

                <div className="preflight-summary-box">
                  <div>
                    <strong>Primary Master Source:</strong>{" "}
                    <span className="tabular-nums">
                      {displayNodes[syncSourceIdx]?.name} ({displayNodes[syncSourceIdx]?.url})
                    </span>
                  </div>
                  <div>
                    <strong>Target Replica Node(s):</strong>{" "}
                    <span className="tabular-nums">
                      {syncTargetIndices
                        .map((i) => `${displayNodes[i]?.name} (${displayNodes[i]?.url})`)
                        .join(", ")}
                    </span>
                  </div>
                  <div>
                    <strong>Selected Sync Scopes:</strong>{" "}
                    {[
                      syncScopes.adlists && "Adlists / Blocklists",
                      syncScopes.domains && "Exact & Regex Domains (Allow/Deny)",
                      syncScopes.groups && "Client Groups",
                      syncScopes.localDns && "Local DNS & CNAME Records"
                    ]
                      .filter(Boolean)
                      .join(" · ")}
                  </div>
                </div>

                <label className="checkbox-label" style={{ marginBottom: "1.1rem" }}>
                  <input
                    type="checkbox"
                    checked={syncScopes.autoBackupBeforeSync}
                    onChange={(e) => setSyncScopes({ ...syncScopes, autoBackupBeforeSync: e.target.checked })}
                  />
                  <span>Create automatic Teleporter snapshot of target nodes prior to overwriting</span>
                </label>

                <div style={{ display: "flex", justifyContent: "flex-end", gap: "0.65rem" }}>
                  <button
                    type="button"
                    className="btn btn-secondary"
                    onClick={() => setShowSyncPreflightModal(false)}
                  >
                    Cancel
                  </button>
                  <button type="button" className="btn btn-sync" onClick={handleExecuteConfirmedSync}>
                    🚀 Confirm & Execute Sync
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Teleporter Restore Confirmation Modal */}
          {confirmRestoreModal && (
            <div className="modal-backdrop" role="dialog" aria-modal="true">
              <div className="modal-dialog">
                <h2 className="modal-title">♻️ Confirm Teleporter Archive Restore</h2>
                <p style={{ fontSize: "0.84rem", color: "var(--text)" }}>
                  Restoring <strong>{restoreFile ? restoreFile.name : "selected archive"}</strong> will overwrite the active configuration on{" "}
                  <strong>{displayNodes[restoreNodeIdx]?.name}</strong>. Do you want to proceed?
                </p>
                <div style={{ display: "flex", justifyContent: "flex-end", gap: "0.65rem", marginTop: "1.1rem" }}>
                  <button type="button" className="btn btn-secondary" onClick={() => setConfirmRestoreModal(false)}>
                    Cancel
                  </button>
                  <button type="button" className="btn btn-red" onClick={handleConfirmRestore}>
                    Confirm Restore
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Admin Auth / Setup Modal */}
          {showAuthModal && (
            <div className="modal-backdrop" role="dialog" aria-modal="true">
              <div className="modal-dialog" style={{ maxWidth: "400px" }}>
                <h2 className="modal-title">
                  {authState.setup_required ? "PiSyncHub Initial Admin Setup" : "PiSyncHub Admin Login"}
                </h2>
                <p style={{ fontSize: "0.82rem", color: "var(--text-muted)", marginTop: 0 }}>
                  {authState.setup_required
                    ? "Create local administrator credentials stored in /config/auth.json."
                    : "Sign in with your PiSyncHub administrator credentials."}
                </p>
                {authError && (
                  <div style={{ color: "var(--accent-red)", fontSize: "0.8rem", marginBottom: "0.75rem" }}>
                    {authError}
                  </div>
                )}
                <form onSubmit={handleAuthSubmit} style={{ display: "flex", flexDirection: "column", gap: "0.8rem" }}>
                  <div className="form-field">
                    <label>Admin Username</label>
                    <input
                      type="text"
                      className="form-input"
                      required
                      value={authForm.username}
                      onChange={(e) => setAuthForm({ ...authForm, username: e.target.value })}
                    />
                  </div>
                  <div className="form-field">
                    <label>Admin Password (min 6 chars)</label>
                    <input
                      type="password"
                      className="form-input"
                      required
                      value={authForm.password}
                      onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                    />
                  </div>
                  {authState.setup_required && (
                    <div className="form-field">
                      <label>Confirm Password</label>
                      <input
                        type="password"
                        className="form-input"
                        required
                        value={authForm.confirm}
                        onChange={(e) => setAuthForm({ ...authForm, confirm: e.target.value })}
                      />
                    </div>
                  )}
                  <div style={{ display: "flex", justifyContent: "flex-end", gap: "0.6rem", marginTop: "0.4rem" }}>
                    <button type="button" className="btn btn-secondary" onClick={() => setShowAuthModal(false)}>
                      Close
                    </button>
                    <button type="submit" className="btn btn-green">
                      {authState.setup_required ? "Save Admin Credentials" : "Log In"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
